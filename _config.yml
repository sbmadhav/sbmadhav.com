# GitHub Pages builds this static site with Jekyll (branch deploy). No theme or layouts:
# every page is hand-written HTML. Keep repo-only files out of the published site.
# The Actions deploy in .github/workflows/site.yml removes the same list; keep them in sync.
exclude:
  - CLAUDE.md
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - LICENSE
  - LICENSE-CONTENT.md
  - site-build.py
  - scripts/
  - "council-*"

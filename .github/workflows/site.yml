name: Site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: The pages use the pinned design system, with no copied tokens
        run: python3 scripts/check-tokens.py

      - name: The shared header matches the pinned design system
        run: python3 scripts/design-system/compose.py --check scripts/design-system/header.html index.html 404.html

      # The versioned files never change, so a vendored copy that differs (and with it a Subresource Integrity
      # hash in the pages) fails. A fetch failure only warns, so a network problem does not block the build.
      - name: Vendored design-system files match the published release
        run: |
          set +e
          python3 scripts/check-tokens.py --upstream
          code=$?
          if [ "$code" = 3 ]; then echo "::warning::could not fetch the published design system; the comparison was skipped"; exit 0; fi
          exit $code

      # Warns, never fails: moving to a new design-system release is a deliberate change
      - name: Newer design-system release
        run: |
          python3 scripts/check-tokens.py --latest || echo "::warning::a newer design-system release is out (or versions.json could not be fetched). See DS_VERSION in site-build.py."

      # Also fails if the source carries stamps (?v= on the scripts, or sw.js VERSION other than 'dev')
      - name: Build _site with cache stamps
        run: python3 site-build.py --out _site

      - name: The build is stamped and has no repo-only files
        run: |
          set -e
          err() { echo "::error::$1"; exit 1; }
          for s in app explore analytics; do
            grep -Eq "assets/$s\.js\?v=[0-9a-f]{10}\"" _site/index.html || err "_site/index.html loads assets/$s.js without a ?v= stamp"
          done
          for f in index.html 404.html; do
            grep -q '<meta http-equiv="Content-Security-Policy" content="default-src' "_site/$f" || err "_site/$f has no Content-Security-Policy <meta>"
          done
          ! grep -q 'gc\.zgo\.at' _site/assets/analytics.js || err "analytics.js must load the vendored /assets/count.js, not gc.zgo.at"
          ds=$(sed -n 's/^DS_VERSION = "\(.*\)"$/\1/p' site-build.py)
          for f in index.html 404.html; do
            grep -q "href=\"/design-system/v/$ds/tokens.css\" integrity=\"sha384-" "_site/$f" || err "_site/$f does not link the pinned design system $ds with integrity"
            grep -q 'class="md-header"' "_site/$f" || err "_site/$f has no shared header"
          done
          grep -Eq "^const VERSION = '[0-9a-f]{10}';" _site/sw.js || err "_site/sw.js VERSION is not a stamped hash"
          grep -q "^const VERSION = 'dev';" sw.js || err "sw.js in git must keep VERSION = 'dev'"
          test -f _site/.nojekyll || err "_site/.nojekyll is missing"
          for f in CLAUDE.md README.md CONTRIBUTING.md SECURITY.md LICENSE LICENSE-CONTENT.md site-build.py _config.yml scripts e2e .github .githooks; do
            test ! -e "_site/$f" || err "_site/$f is a repo-only file and must not be published"
          done
          find _site -type f | sort

      # The exact files checked above are the ones deployed
      - name: Upload _site for the deploy job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  # Publishes _site (stamped) to GitHub Pages. Needs Settings > Pages > Source set to
  # "GitHub Actions" AND the repository variable PAGES_VIA_ACTIONS set to true; until both
  # are done, Pages deploys the master branch with Jekyll, which publishes the UNSTAMPED
  # source (it still works, without cache busting). See "Deploy" in README.md.
  deploy:
    needs: check
    if: vars.PAGES_VIA_ACTIONS == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

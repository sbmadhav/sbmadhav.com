name: Site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run the build
        run: |
          python3 site-build.py

      - name: Generated files are committed
        run: |
          git diff --exit-code || {
            echo "::error::The builds changed the files above. Run python3 site-build.py, then commit the results."
            exit 1
          }

      - name: Home page colors match the pinned tokens
        run: python3 scripts/check-tokens.py

      # Warns, never fails: a color change in sbmadhav/design-system should not break this repo's CI
      - name: Pinned tokens match sbmadhav/design-system
        run: |
          python3 scripts/check-tokens.py --upstream || echo "::warning::index.html or scripts/design-tokens.json is behind sbmadhav/design-system. Run python3 scripts/check-tokens.py --refresh and fix index.html."

  # Off until the owner sets Settings > Pages > Source to "GitHub Actions" and
  # the repository variable PAGES_VIA_ACTIONS to true. Until then the branch
  # deploy (Jekyll, _config.yml) keeps serving the site.
  deploy:
    needs: check
    if: vars.PAGES_VIA_ACTIONS == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Assemble _site without repo-only files
        # Same list as exclude: in _config.yml
        run: |
          rsync -a ./ _site/ \
            --exclude '.*' \
            --exclude '_site/' \
            --exclude '_config.yml' \
            --exclude 'CLAUDE.md' \
            --exclude 'README.md' \
            --exclude 'site-build.py' \
            --exclude 'scripts/' \
            --exclude 'council-*' \
            --exclude 'e2e/'
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

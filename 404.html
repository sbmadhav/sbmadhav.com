<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Madhav</title>
<meta name="description" content="This page does not exist. Head home or open the Explore menu.">
<meta name="robots" content="noindex">
<!-- Apply the saved color scheme before paint so there is no flash -->
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('motion')==='paused')document.documentElement.classList.add('motion-paused');}catch(e){}</script>
<meta name="theme-color" content="#F6F7F9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='14' width='48' height='40' rx='14' fill='%234FB3A6'/%3E%3Ccircle cx='24' cy='34' r='7' fill='white'/%3E%3Ccircle cx='40' cy='34' r='7' fill='white'/%3E%3Ccircle cx='25' cy='35' r='3' fill='%23151B2B'/%3E%3Ccircle cx='41' cy='35' r='3' fill='%23151B2B'/%3E%3Ccircle cx='32' cy='7' r='5' fill='%23EE7A63'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<!-- Fonts are self-hosted; tokens.css declares the faces. Preload the two that render first. -->
<link rel="preload" href="/assets/fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/nunito-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/design-system/tokens.css">
<link rel="stylesheet" href="/design-system/components.css">
<style>
  @media (max-width: 480px) { .top .md-switch > span:first-child { display: none; } .top .md-switch { padding-left: 6px; } .top .md-wrap { gap: 6px; } }
  .top { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom: 1px solid var(--line); }
  .top .md-wrap { display: flex; align-items: center; gap: 10px; height: 66px; }
  .home { display: inline-flex; align-items: center; gap: 10px; font: 600 1.25rem/1 var(--display); text-decoration: none; color: var(--ink); margin-right: auto; }
  .home svg { width: 32px; height: 32px; flex: none; }
  @media (max-width: 480px) { .home { font-size: 0; gap: 0; } }
  /* Narrow phones (320px): the controls wrap to a second row instead of running off the screen */
  @media (max-width: 400px) { .top .md-wrap { flex-wrap: wrap; justify-content: flex-end; height: auto; min-height: 66px; padding-block: var(--space-2); row-gap: var(--space-2); } }

  .lost { min-height: calc(100vh - 66px); display: flex; align-items: center; }
  .lost .md-wrap { display: grid; grid-template-columns: 1fr auto; gap: var(--space-7); align-items: center; }
  .lost .code { font: 700 clamp(4.5rem, 16vw, 9rem)/1 var(--display); color: var(--coral-strong); letter-spacing: -.03em; margin: var(--space-4) 0 var(--space-2); }
  .lost .md-lede { max-width: 34rem; }
  .missing { color: var(--ink-muted); font-size: 15px; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-6); }
  .bolt { width: min(220px, 40vw); height: auto; }
  @media (prefers-reduced-motion: no-preference) { html:not(.motion-paused) .bolt { animation: drift 5s ease-in-out infinite; } }
  @keyframes drift { 50% { transform: translateY(-12px) rotate(-6deg); } }
  @media (max-width: 700px) { .lost .md-wrap { grid-template-columns: 1fr; } .bolt { order: -1; width: 140px; } }
</style>
</head>
<body class="md-page md-root">

<header class="top">
  <div class="md-wrap">
    <a class="home" href="/" aria-label="Madhav, home"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="14" width="48" height="40" rx="14" fill="#4FB3A6" stroke="#151B2B" stroke-width="3"/><circle cx="24" cy="34" r="7" fill="#fff"/><circle cx="40" cy="34" r="7" fill="#fff"/><circle cx="25" cy="35" r="3" fill="#151B2B"/><circle cx="41" cy="35" r="3" fill="#151B2B"/><path d="M32 14V9" stroke="#151B2B" stroke-width="3"/><circle cx="32" cy="7" r="5" fill="#EE7A63" stroke="#151B2B" stroke-width="3"/></svg>Madhav</a>
    <button class="xp-btn" id="exploreBtn" aria-label="Explore all pages"><svg class="xp-dots" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7l6 4 6-5M12 11l-3 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".55"/><circle cx="6" cy="7" r="2.4" fill="var(--coral)"/><circle cx="12" cy="11" r="2.4" fill="var(--sun)" stroke="currentColor" stroke-width="1.2"/><circle cx="18" cy="6" r="2.4" fill="var(--teal)"/><circle cx="9" cy="18" r="2.4" fill="var(--sky)"/></svg><span class="xp-lbl"><span class="pro">Explore</span><span class="kid">Star map</span></span></button>
    <div class="md-modes" role="group" aria-label="Color mode">
      <button data-mode="system" aria-pressed="true">System</button><button data-mode="light" aria-pressed="false">Daybreak</button><button data-mode="dark" aria-pressed="false">Deep Space</button>
    </div>
    <button class="md-switch" id="kidBtn" role="switch" aria-checked="false" aria-label="Kid mode"><span>Kid mode</span><span class="md-track"><span class="md-knob"></span></span></button>
  </div>
</header>

<main class="lost">
  <div class="md-wrap">
    <div>
      <span class="md-tag md-tag--coral"><span class="pro">Page not found</span><span class="kid">Lost in space</span></span>
      <p class="code" aria-hidden="true">404</p>
      <h1 class="md-heading"><span class="pro">This page does not exist.</span><span class="kid">Bolt flew off the map!</span></h1>
      <p class="md-lede"><span class="pro">The link may be old, or the address may have a typo. Nothing is broken on your side.</span><span class="kid">There is nothing at this spot. Let's fly back to a place we know.</span></p>
      <p class="missing" id="missing" hidden><span class="pro">You asked for</span><span class="kid">You tried</span> <code class="md-mono"></code></p>
      <div class="actions">
        <a class="md-btn md-btn--primary" href="/"><span class="pro">Go to the home page</span><span class="kid">Fly home</span></a>
        <button class="md-btn" type="button" id="openExplore"><span class="pro">See every page</span><span class="kid">Open the star map</span></button>
      </div>
    </div>
    <img class="bolt" src="/design-system/icons/bolt.svg" alt="" width="160" height="170">
  </div>
</main>

<script>
(() => {
  const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  // Color mode: follow the system by default; Daybreak or Deep Space overrides and is remembered
  const root = document.documentElement, mq = matchMedia('(prefers-color-scheme: dark)');
  const meta = document.querySelector('meta[name="theme-color"]');
  const modeBtns = document.querySelectorAll('.md-modes button');
  const applyMode = mode => {
    if (mode === 'system') delete root.dataset.theme; else root.dataset.theme = mode;
    store.set('theme', mode === 'system' ? '' : mode);
    modeBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    meta.setAttribute('content', (mode === 'dark' || (mode === 'system' && mq.matches)) ? '#0F1218' : '#F6F7F9');
  };
  modeBtns.forEach(b => b.addEventListener('click', () => applyMode(b.dataset.mode)));
  mq.addEventListener('change', () => { if (!root.dataset.theme) applyMode('system'); });
  applyMode(root.dataset.theme || 'system');
  // Kid mode: shared with the home page through the same storage key
  const kidBtn = document.getElementById('kidBtn');
  const setKid = on => { document.body.classList.toggle('kidmode', on); kidBtn.setAttribute('aria-checked', String(on)); store.set('kidmode', on ? '1' : '0'); };
  kidBtn.addEventListener('click', () => setKid(!document.body.classList.contains('kidmode')));
  setKid(new URLSearchParams(location.search).has('kid') || store.get('kidmode') === '1');
  // Show the address that was asked for, and open the Explore menu from the page
  const missing = document.getElementById('missing');
  missing.querySelector('code').textContent = location.pathname;
  missing.hidden = false;
  document.getElementById('openExplore').addEventListener('click', () => document.getElementById('exploreBtn').click());
  addEventListener('load', () => { if (window.siteTrack) window.siteTrack('404' + location.pathname, 'Page not found'); }, { once: true });
})();
</script>
<script src="/assets/explore.js" defer></script>
<script src="/assets/analytics.js" defer></script>
</body>
</html>
